<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Nhôm - OPOPO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-slate-100 text-slate-800">
    <div class="mx-auto max-w-6xl p-4">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold">Quản lý Nhôm</h1>
            </div>
            <a href="./" class="rounded bg-gray-500 px-4 py-2 text-sm font-medium text-white hover:bg-gray-600">
                ← Quay lại
            </a>
        </div>

        <!-- Form thêm nhôm mới -->
        <div class="rounded border bg-white p-6 mb-6">
            <h2 class="text-lg font-bold mb-4">Thêm loại nhôm mới</h2>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
                <div>
                    <label class="block text-sm font-medium mb-1">Tên nhôm</label>
                    <input id="aluminumName" type="text" placeholder="Ví dụ: vách C3209" 
                        class="w-full rounded border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Mã</label>
                    <input id="aluminumCode" type="text" placeholder="Ví dụ: C3209" 
                        class="w-full rounded border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Cân nặng (g/m)</label>
                    <input id="aluminumWeight" type="number" step="0.001" placeholder="Ví dụ: 4651" 
                        class="w-full rounded border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Số lượng nẹp</label>
                    <input id="aluminumProfileCount" type="number" min="0" placeholder="Ví dụ: 0" value="0"
                        class="w-full rounded border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500">
                </div>
                <button id="addAluminumBtn" class="rounded bg-sky-800 hover:bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-600 h-10">
                    Thêm
                </button>
            </div>
        </div>

        <!-- Danh sách nhôm -->
        <div class="rounded border bg-white p-6">
            <h2 class="text-lg font-bold mb-4">Danh sách loại nhôm</h2>
            <div id="aluminumList" class="space-y-3">
                <!-- Render danh sách từ JS -->
            </div>
        </div>
    </div>

    <script src="./js/services/aluminumService.js" defer></script>
    <script src="./js/ui/aluminumUI.js" defer></script>
    <script src="./js/aluminum.js" defer></script>
</body>

</html>
