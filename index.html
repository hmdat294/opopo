<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opopo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="./assets/logo_opopo.png">
</head>

<body style="background-color: rgb(0, 20, 40);">
    <canvas id="smokeCanvas" class="w-full h-full fixed top-0 left-0 -z-10"></canvas>

    <div class="mx-auto max-w-6xl p-4">
        <div class="flex justify-between items-center">
            <div>
                <img src="./assets/logo_opopo.png" alt="OPOPO" width="80">
            </div>

            <div class="flex gap-3 items-center">
                <!-- Settings Modal Button -->
                <button id="settingsBtn"
                    class="rounded bg-rose-800 px-3 py-2 text-sm font-medium text-white hover:bg-rose-600"
                    title="Cài đặt">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
                    </svg>
                </button>
                <div style="background: linear-gradient(to right, rgba(51, 65, 85, 0.5), rgba(55, 85, 135, 0.5));"
                    class="rounded border border-slate-500 p-3 shadow-sm">
                    <div class="flex flex-wrap items-center gap-2">
                        <input id="customerNameInput" type="text" placeholder="Tên khách hàng"
                            class="w-full min-w-[200px] flex-1 rounded border border-slate-500 bg-slate-800 text-slate-300 px-3 py-1 placeholder:text-slate-400 focus:border-blue-500">
                        <button id="addCustomerBtn" class="rounded bg-sky-800 hover:bg-sky-600 px-3 py-1 text-sm font-medium text-white"
                            title="Thêm khách hàng">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="size-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                            </svg>
                        </button>
                        <button id="resetAllBtn" class="rounded bg-pink-800 hover:bg-pink-600 px-3 py-1 text-sm font-medium text-white"
                            title="Xóa toàn bộ">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="size-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
            <div class="bg-slate-700 rounded-lg p-6 shadow-lg max-w-sm w-full mx-4">
                <h2 class="text-xl font-bold mb-4 text-slate-100">Cài đặt</h2>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2 text-slate-100">Đơn giá mặc định (VND/kg)</label>
                    <input id="unitPriceInput" type="number" min="0"
                        class="w-full rounded border border-slate-300 px-3 py-2 bg-slate-600 text-slate-100 placeholder:text-slate-400 focus:border-blue-500 outline-none">
                </div>
                <div class="flex gap-2 justify-end">
                    <button id="settingsCancelBtn"
                        class="rounded bg-slate-500 px-4 py-2 text-sm font-medium text-slate-100 hover:bg-slate-600">Hủy</button>
                    <button id="settingsSaveBtn"
                        class="rounded bg-sky-800 hover:bg-sky-600 px-4 py-2 text-sm font-medium text-white">Lưu</button>
                </div>
            </div>
        </div>

        <!-- Tab Quản lý khách hàng -->
        <div id="customersTab" class="mt-4">
            <div id="customersContainer" class="grid grid-cols-3 gap-2"></div>
        </div>
    </div>
    <script src="./js/services/aluminumService.js" defer></script>
    <script src="./js/data/state.js" defer></script>
    <script src="./js/services/optimizationService.js" defer></script>
    <script src="./js/controllers/customerController.js" defer></script>
    <script src="./js/ui/exportUI.js" defer></script>
    <script src="./js/ui/render.js" defer></script>
    <script src="./js/main.js" defer></script>
    <script src="./js/smoke.js" defer></script>
</body>

</html>
